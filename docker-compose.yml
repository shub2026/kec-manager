# KEC 课程管理平台 Docker Compose 配置
# 适用于 1Panel 容器化部署

services:
  # 后端服务 - Node.js + SQLite
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX:-kec}-server
    # M-9 修复：限制重启次数，避免迁移失败导致容器无限重启
    restart: on-failure:5
    ports:
      - "${SERVER_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/kec.db
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_DOWNLOAD_SECRET=${JWT_DOWNLOAD_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-12}
      - DEFAULT_SEMESTER=${DEFAULT_SEMESTER}
    volumes:
      # 数据持久化 - 使用 named volume 避免 bind mount 的宿主机权限冲突
      # （容器内 appuser 非 root，bind mount 的 ./data 默认 root 所有导致无法写入 SQLite）
      - kec-data:/app/data
      - kec-uploads:/app/uploads
    networks:
      - kec-network
    healthcheck:
      # 用 -O /dev/null 实际请求而非 --spider (HEAD)，避免某些后端不支持 HEAD 误判
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--tries=1", "--timeout=5", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 资源限制（可选）
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # 前端服务 - Nginx 静态文件服务器
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: ${CONTAINER_PREFIX:-kec}-client
    restart: always
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - kec-network
    # 资源限制（可选）
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

# 网络配置
networks:
  kec-network:
    driver: bridge
    name: ${NETWORK_NAME:-kec-network}

# 数据卷声明 - named volume 由 Docker 管理，容器内 appuser 可正常写入
volumes:
  kec-data:
    name: ${CONTAINER_PREFIX:-kec}-data
  kec-uploads:
    name: ${CONTAINER_PREFIX:-kec}-uploads
