services:
  kec-manager:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 基础镜像地址：默认官方镜像；国内网络可在服务器 .env 中配置
        # NODE_IMAGE=<镜像加速地址>/library/node:20-alpine（.env 不会上传到仓库）
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        # 应用镜像版本标签：在 .env 中配置 APP_VERSION（如 v1.4.1），未配置默认 latest
        APP_VERSION: ${APP_VERSION:-latest}
    # 显式镜像标签：支持 docker push 到仓库 + 按版本回滚
    # 镜像仓库地址可用 .env 的 IMAGE_REPO 覆盖（如 registry.example.com/kec-manager）
    image: ${IMAGE_REPO:-kec-manager}:${APP_VERSION:-latest}
    container_name: kec-manager
    restart: unless-stopped
    # 优雅停止宽限：默认 10s 后 SIGKILL 会打断正在进行的 SQLite 写入，
    # 延长到 30s 让事务正常提交/回滚，降低库损坏风险
    stop_grace_period: 30s
    ports:
      - "3000:3000"
    # 使用 .env 文件加载环境变量（推荐生产环境使用）
    env_file:
      - .env
    volumes:
      # SQLite 数据库持久化
      - ./data:/app/server/data
      # 上传文件持久化（multer 临时文件）
      - ./uploads:/app/server/uploads
      # 日志持久化
      - ./logs:/app/server/logs
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/server/data/kec.db
      # multer 上传临时目录（指向挂载的持久化卷）
      - UPLOAD_DIR=/app/server/uploads
      - JWT_SECRET=${JWT_SECRET:-please_change_this_to_random_string}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-please_change_this_to_random_string}
      - JWT_DOWNLOAD_SECRET=${JWT_DOWNLOAD_SECRET:-please_change_this_to_random_string}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - JWT_DOWNLOAD_EXPIRES_IN=30s
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=info
      - BCRYPT_ROUNDS=12
      - MAX_FILE_SIZE=10
      - DEFAULT_SEMESTER=${DEFAULT_SEMESTER:-2025-2026-2}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
