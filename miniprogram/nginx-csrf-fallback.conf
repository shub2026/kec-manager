# KEC 教务 · 微信小程序 CSRF Cookie 兜底配置
# ============================================================
# 问题背景：
#   后端 /api/* 启用 Double Submit Cookie + HMAC 签名的 CSRF 防护：
#   POST/PUT/DELETE 请求必须同时携带 Header: X-CSRF-Token 与 Cookie: XSRF-TOKEN，
#   且二者一致、HMAC 签名有效。
#
#   微信小程序的 wx.request 在请求第三方域名时，不会回传 SameSite=Strict 的 cookie
#   （小程序运行环境与域名非同站，浏览器/微信内核按 Strict 策略 withhold cookie）。
#   因此登录时虽然小程序已带 X-CSRF-Token 头，后端却收不到 XSRF-TOKEN cookie，
#   导致 403 "CSRF验证失败，请刷新页面后重试"。
#
# 解决思路（不改现有后端/前端业务代码）：
#   在 Nginx 反代层检测：当请求已带 X-CSRF-Token 头、但 Cookie 里没有 XSRF-TOKEN 时，
#   按头里的值补一个 XSRF-TOKEN cookie 再传给后端。
#   由于 token 本身由后端 HMAC 签名，攻击者无法伪造有效值，安全性不降低。
#   Web 端正常浏览器仍会主动回传 XSRF-TOKEN cookie，不会走到这条兜底分支。
#
# 使用方法：
#   把下面 location 片段放进 kec.sntip.cn 的 443 server 块中 /api 代理位置，
#   放在 proxy_pass 之前，并替换最后的 upstream。
# ============================================================

location /api/ {
    # ... 你现有的 proxy_pass / ssl / 超时 / 真实 IP 等配置 ...

    # ---- CSRF Cookie Fallback（小程序兜底） ----
    set $final_cookie $http_cookie;

    # 如果 Cookie 里没有 XSRF-TOKEN，则按 X-CSRF-Token 头补一个
    if ($http_cookie !~* "XSRF-TOKEN=") {
        set $final_cookie "$http_cookie; XSRF-TOKEN=$http_x_csrf_token";
    }

    # 去掉原始 Cookie 为空时产生的开头 "; "
    if ($final_cookie ~ "^; (.+)$") {
        set $final_cookie $1;
    }

    proxy_set_header Cookie $final_cookie;
    # ---- /CSRF Cookie Fallback ----

    proxy_pass http://127.0.0.1:3002;   # <-- 改成你的后端 upstream
}
