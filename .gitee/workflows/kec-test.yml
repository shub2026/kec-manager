# Gitee Go 流水线配置：push 后自动跑测试
# 放置路径：.gitee/workflows/kec-test.yml
# 在 Gitee 平台激活：项目 → DevOps → Gitee Go → 新建流水线 → 选择 "使用仓库内配置文件"

# 触发条件：main 分支 push 且涉及 server 代码时触发
trigger:
  push:
    branches:
      - main
    paths:
      - "server/**"

jobs:
  test:
    name: "运行单元测试"
    runs-on: node:18
    steps:
      - name: "拉取代码"
        run: git clone https://gitee.com/shub77/kec-manager.git . && git checkout main

      - name: "安装依赖"
        run: |
          cd server
          npm ci

      - name: "运行测试"
        run: |
          cd server
          npm test

      - name: "测试失败"
        if: failure()
        run: |
          echo "测试失败，部署阻断"
          exit 1
