<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>KEC课程管理平台</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 首屏加载态：色彩/字体栈与 theme.css 令牌一致（#1c82f5 品牌蓝、#64748b 次级文字），防进应用瞬间色温闪变 -->
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;color:#64748b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','PingFang SC','Hiragino Sans GB','MiSans','HarmonyOS Sans SC','Microsoft YaHei',Arial,sans-serif;">
        <div style="width:36px;height:36px;border:3px solid #e3eaf3;border-top-color:#1c82f5;border-radius:50%;animation:app-spin .8s linear infinite;"></div>
        <span style="font-size:14px;">正在加载...</span>
      </div>
      <style>@keyframes app-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
