<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>KEC课程管理平台</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;color:#606266;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <div style="width:36px;height:36px;border:3px solid #e4e7ed;border-top-color:#198CFF;border-radius:50%;animation:app-spin .8s linear infinite;"></div>
        <span style="font-size:14px;">正在加载...</span>
      </div>
      <style>@keyframes app-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
